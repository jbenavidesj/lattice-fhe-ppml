name: Paper 1 validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python arithmetic audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit candidate parameters
        run: python scripts/audit_parameters.py
      - name: Differential-test AsymRed
        run: python scripts/verify_asymred.py
      - name: Check negacyclic reference
        run: python scripts/verify_negacyclic.py
      - name: Audit toy BFV multiplication noise bound
        run: python scripts/audit_toy_bfv_noise.py

  rust:
    name: Rust tests and benchmark compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --lib
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile benchmark target
        run: cargo bench --no-run
