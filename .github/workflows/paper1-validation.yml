name: Paper 1 validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python arithmetic audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit candidate parameters
        run: python scripts/audit_parameters.py
      - name: Differential-test AsymRed
        run: python scripts/verify_asymred.py
      - name: Check negacyclic reference
        run: python scripts/verify_negacyclic.py
      - name: Audit toy BFV multiplication noise bound
        run: python scripts/audit_toy_bfv_noise.py
      - name: Audit N=8192 RNS-BFV multiplication noise bound
        run: python scripts/audit_rns_bfv_noise.py
      - name: Verify ternary negacyclic-square parity identity
        run: python scripts/verify_ternary_square_parity.py
      - name: Run toy exhaustive evaluation-key candidate experiment
        run: python scripts/toy_evalkey_exhaustive_search.py
      - name: Measure staged public/evaluation-key candidate filtering
        run: python scripts/audit_evalkey_filtering.py
      - name: Audit adjacent-level linear evaluation-key prefilters
        run: python scripts/audit_evalkey_linear_prefilter.py
      - name: Measure adjacent-level prefilters inside the toy MITM pipeline
        run: python scripts/audit_mitm_linear_prefilter.py
      - name: Audit split-secret square and evaluation residual identity
        run: python scripts/audit_split_secret_square.py
      - name: Run toy meet-in-the-middle cross-check
        run: python scripts/toy_evalkey_mitm.py
      - name: Audit adaptive MITM selector across q and eta
        run: python scripts/audit_mitm_selector.py
      - name: Evaluate frozen adaptive MITM selector on held-out instances
        run: python scripts/audit_mitm_selector_holdout.py
      - name: Evaluate frozen MITM selector across held-out q and eta
        run: python scripts/audit_mitm_selector_robustness.py


  sage-estimator:
    name: Pinned LWE proxy diagnostic (SageMath)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.10
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*
      - name: Check SageMath runtime
        run: |
          sage --version
          git --version
      - name: Install pinned lattice-estimator revision
        run: |
          git clone https://github.com/malb/lattice-estimator.git /tmp/lattice-estimator
          git -C /tmp/lattice-estimator checkout 7d59f866655362ea8eab803dbc833710c2bc362a
          cd /tmp/lattice-estimator
          sage -pip install -e .
      - name: Run bounded rough-profile LWE proxy diagnostic
        run: |
          if sage -python scripts/estimate_lwe_proxy.py > sage-lwe-proxy-output.txt 2>&1; then
            status=0
          else
            status=$?
          fi
          cat sage-lwe-proxy-output.txt
          exit "$status"
      - name: Audit exact weighted evaluation-key error distributions
        run: |
          python scripts/audit_evalkey_weighted_error_distribution.py | tee evalkey-weighted-error-distribution.txt
      - name: Search short modular target-cancellation relations
        run: |
          if sage -python scripts/search_evalkey_short_relations.sage.py > evalkey-short-relations.txt 2>&1; then
            status=0
          else
            status=$?
          fi
          cat evalkey-short-relations.txt
          exit "$status"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-lwe-proxy-diagnostic
          path: |
            sage-lwe-proxy-output.txt
            evalkey-short-relations.txt
            evalkey-weighted-error-distribution.txt
          if-no-files-found: warn
  rust:
    name: Rust tests and benchmark compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --lib
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile benchmark target
        run: cargo bench --no-run
