name: Paper 1 validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm validation documents exist
        run: |
          test -s PAPER1/VALIDATION_STATUS.md
          test -s PAPER1/PARAMETER_CANDIDATES.md
          test -s PAPER1/BENCHMARK_PROTOCOL.md

  rust:
    name: Rust checks (when crate is added)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile benchmarks
        run: cargo bench --no-run
