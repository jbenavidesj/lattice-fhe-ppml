name: Build Paper 1 IEEEtran PDF

on:
  workflow_dispatch:
  push:
    branches:
      - paper1-validation-corrections
    paths:
      - "PAPER1/IEEE_MANUSCRIPT_DRAFT.md"
      - "PAPER1/build_ieee_manuscript.py"
      - "PAPER1/IEEEtran-journal-template.tex"
      - ".github/workflows/paper1-ieee-pdf.yml"

permissions:
  contents: read

jobs:
  typeset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript branch
        uses: actions/checkout@v4
        with:
          ref: paper1-validation-corrections

      - name: Install Pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-publishers texlive-latex-extra texlive-fonts-recommended

      - name: Prepare manuscript for IEEEtran
        run: python3 PAPER1/build_ieee_manuscript.py

      - name: Convert Markdown to IEEEtran LaTeX
        run: |
          pandoc build/IEEE_MANUSCRIPT.md \
            --from=markdown+pipe_tables+raw_tex+tex_math_dollars \
            --to=latex \
            --standalone \
            --template=PAPER1/IEEEtran-journal-template.tex \
            --metadata title="An Experimental RNS-BFV Implementation with Exact Integer-Lift Multiplication and Reproducible Correctness Audits" \
            --wrap=none \
            --output=build/Paper1_IEEEtran.tex

      - name: Compile PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build build/Paper1_IEEEtran.tex > build/pdflatex-pass1.log
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build build/Paper1_IEEEtran.tex > build/pdflatex-pass2.log
          test -s build/Paper1_IEEEtran.pdf
          pdfinfo build/Paper1_IEEEtran.pdf | tee build/pdfinfo.txt

      - name: Upload PDF, LaTeX source, and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-ieee-typeset
          path: |
            build/Paper1_IEEEtran.pdf
            build/Paper1_IEEEtran.tex
            build/pdflatex-pass1.log
            build/pdflatex-pass2.log
            build/pdfinfo.txt
          if-no-files-found: warn
          retention-days: 30
